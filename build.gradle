//file:noinspection GrUnresolvedAccess
import java.nio.file.Files

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
    id 'net.minecraftforge.licenser' version '1.2.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()
    maven { url = "https://maven.enginehub.org/repo/" }
    maven { url = "https://cursemaven.com/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {

    // Lombok - Compile only
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    // Lombok - Compile only
    testCompileOnly("org.projectlombok:lombok:1.18.46")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.46")

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // External libraries for PMTiles and Webp image loading support
    implementation("io.tileverse.pmtiles:tileverse-pmtiles:${project.tileverse_version}")
    implementation("io.tileverse.rangereader:tileverse-rangereader-core:${project.tileverse_version}")
    implementation("com.sksamuel.scrimage:scrimage-webp:${project.scrimage_version}")
    implementation("com.opencsv:opencsv:${project.opencsv_version}")
    implementation("org.jsoup:jsoup:${project.jsoup_version}")
    implementation("com.google.code.gson:gson:${project.gson_version}")
    implementation("com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}")
    implementation("com.jakewharton:disklrucache:${project.disklrucache_version}")
    implementation("com.cronutils:cron-utils:${project.cron_utils_version}")

    // Include in release jar - transitive dependencies for PMTiles and Webp image loading support
    include("commons-io:commons-io:2.20.0")
    include("io.tileverse.pmtiles:tileverse-pmtiles:${project.tileverse_version}")
    include("io.tileverse.rangereader:tileverse-rangereader-core:${project.tileverse_version}")
    include("com.sksamuel.scrimage:scrimage-webp:${project.scrimage_version}")
    include("com.sksamuel.scrimage:scrimage-core:${project.scrimage_version}")
    include("tools.jackson.core:jackson-core:${project.jackson_version}")
    include("com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}")
    include("tools.jackson.core:jackson-databind:${project.jackson_version}")
    include("com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}")
    include("com.jakewharton:disklrucache:${project.disklrucache_version}")
    include("com.drewnoakes:metadata-extractor:${project.metadata_extractor_version}")
    include("com.opencsv:opencsv:${project.opencsv_version}")
    include("org.jsoup:jsoup:${project.jsoup_version}")
    include("com.cronutils:cron-utils:${project.cron_utils_version}")

    // Optional integrations - compile against them, never require them at runtime.
    compileOnly(files("libs/ArdaRegionsStub-2.0.1+mc.26.1.jar"))
    compileOnly(files("libs/ArdaPathsStub-1.4.0+mc.26.1.jar"))
    compileOnly(files("libs/HuskHomes-Fabric-4.11-ab42970+mc.26.1.2.jar"))
    compileOnly(files("libs/HuskHomes-Common-4.11-ab42970.jar"))

    // DevAuth Neo - Dev/Debug authentication support (dev runtime only)
    localRuntime("net.litetex.mcm:dev-auth-neo:${project.devauth_version}")

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

license {
    header = rootProject.file('HEADER')
    include '**/*.java'
    newLine = true
}

processResources {
    inputs.property "version", project.version
    //noinspection GrUnresolvedAccess
    inputs.property "minecraft_version", project.minecraft_version
    //noinspection GrUnresolvedAccess
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_dependency", ">=${project.minecraft_version}"
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "minecraft_dependency": ">=${project.minecraft_version}"
    }
}

def clientRunDir = "run-26_1"
def serverRunDir = "run-server-26_1"
def devRuntimeMods = [
        [name: 'HuskHomes-Fabric', version: "${project.huskhomes_version}", source: file("libs/HuskHomes-Fabric-${project.huskhomes_version}.jar"), runtimeEnv: "server"],
        [name: 'ArdaRegionsStub', version: "${project.ardaregions_version}", source: file("libs/ArdaRegionsStub-${project.ardaregions_version}+mc.26.1.jar"), runtimeEnv: "both"],
        [name: 'ArdaPathsStub', version: "${project.ardapaths_version}", source: file("libs/ArdaPathsStub-${project.ardapaths_version}+mc.26.1.jar"), runtimeEnv: "both"]
]

loom {
    runs {
        client {
            client()
            getRunDirectory().set(layout.projectDirectory.dir(clientRunDir))
            getJvmArguments().addAll("-Xmx8G", "-Xms8G")
            getProgramArguments().addAll("--width", "1920", "--height", "1080")
            getSystemProperties().put("devauth.enabled", "1")
            getSystemProperties().put("devauth.account", "main")
        }
        server {
            server()
            getRunDirectory().set(layout.projectDirectory.dir(serverRunDir))
        }
    }
}
java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.compilerArgs += "-Xlint:unchecked"
    }
}

tasks.register('setupDevEnv') {
    description = 'Sets up the development environment with server mods'
    group = 'ide'

    doLast {

        def serverDir = file(serverRunDir)
        def serverModsDir = new File(serverDir, 'mods')
        def clientDir = file(clientRunDir)
        def clientModsDir = new File(clientDir, 'mods')

        // Create directories

        if (!serverDir.exists()) {
            serverDir.mkdirs()
            println "Created directory: ${serverRunDir}"
        }

        if (!serverModsDir.exists()) {
            serverModsDir.mkdirs()
            println "Created directory: ${serverRunDir}/mods"
        }

        if (!clientDir.exists()) {
            clientDir.mkdirs()
            println "Created directory: ${clientRunDir}"
        }

        if (!clientModsDir.exists()) {
            clientModsDir.mkdirs()
            println "Created directory: ${clientRunDir}/mods"
        }

        devRuntimeMods.each { mod ->

            def downloadToServer = mod.runtimeEnv == "server" || mod.runtimeEnv == "both"
            def downloadToClient = mod.runtimeEnv == "client" || mod.runtimeEnv == "both"

            if (downloadToServer) {
                def serverFile = new File(serverModsDir, "${mod.name}-${mod.version}.jar")
                if (!serverFile.exists()) {
                    if (!mod.source.exists()) {
                        println "Skipping ${mod.name}; local jar is missing at ${mod.source}"
                        return
                    }
                    println "Copying ${mod.name} to server..."
                    Files.copy(mod.source.toPath(), serverFile.toPath())
                    println "Copied ${mod.name} to server"
                } else {
                    println "${mod.name} already exists in server, skipping"
                }

                if (mod.runtimeEnv == "both") {
                    def clientFile = new File(clientModsDir, "${mod.name}-${mod.version}.jar")
                    if (!clientFile.exists()) {
                        println "Creating symlink for ${mod.name} in client..."
                        Files.createSymbolicLink(
                                clientFile.toPath(),
                                serverFile.toPath()
                        )
                        println "Symlink created for ${mod.name}"
                    }
                }
            } else if (downloadToClient) {
                def clientFile = new File(clientModsDir, "${mod.name}-${mod.version}.jar")
                if (!clientFile.exists()) {
                    if (!mod.source.exists()) {
                        println "Skipping ${mod.name}; local jar is missing at ${mod.source}"
                        return
                    }
                    println "Copying ${mod.name} to client..."
                    Files.copy(mod.source.toPath(), clientFile.toPath())
                    println "Copied ${mod.name}"
                } else {
                    println "${mod.name} already exists, skipping"
                }
            }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
